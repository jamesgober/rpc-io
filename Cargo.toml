# =============================================================================
#  R E P S   ·   rpc-io
# =============================================================================
[package]
name    = "rpc-io"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "JSON-RPC 2.0 engine with Content-Length and newline framings, a sans-IO core, and a blocking adapter: one transport for LSP, DAP, MCP, and service APIs."

# Keywords (5 max)
keywords = ["json-rpc", "rpc", "lsp", "mcp", "protocol"]

# Categories
categories = ["network-programming", "encoding"]

# Links
homepage      = "https://github.com/jamesgober/rpc-io"
repository    = "https://github.com/jamesgober/rpc-io"
documentation = "https://docs.rs/rpc-io"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "rpc_io"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The endpoint (dispatcher, outgoing calls, cancellation, the blocking adapter)
# needs threads, clocks, and panic containment. Without `std` the crate is the
# message model, the framings, and the correlation map, on `alloc` only.
std = ["jsonx-lib/std"]
# Spans for every call handled and events for what the endpoint does on its
# own, through `tracing`. Off, the instrumentation compiles to nothing.
tracing = ["std", "dep:tracing"]
# The async adapter over `futures-io`'s traits: `Endpoint::run_async`, and
# `Outbox` as an `AsyncRead`/`AsyncBufRead` with `write_to`.
futures-io = ["std", "dep:futures-io"]
# Typed params and results through `serde`: `Params::deserialize`,
# `Router::request_typed`, `Peer::request_typed`, `Call::wait_typed`, and
# `Serialize`/`Deserialize` for `Id` and `ErrorCode`.
serde = ["std", "dep:serde", "dep:serde_json"]


# DEPENDENCIES
# #################################
[dependencies]
# The owner's JSON: borrowing parser, pull reader with raw slices, writer.
jsonx-lib = { version = "0.2", default-features = false }
# Optional, off by default: the `tracing` feature's instrumentation. The
# ecosystem's standard facade (no runtime of its own); default features off,
# so no proc-macro crate is pulled in.
tracing = { version = "0.1.41", optional = true, default-features = false, features = ["std"] }
# Optional, off by default: the `futures-io` feature's async adapter. Only the
# runtime-agnostic I/O traits (no dependencies of its own, no runtime), which
# smol and async-std implement and tokio reaches through `tokio-util` compat.
futures-io = { version = "0.3.31", optional = true, default-features = false, features = ["std"] }
# Optional, off by default: the `serde` feature, for interop with protocol
# type crates (`lsp-types`, MCP schemas) written against serde. `serde_json`
# reads values from the text the endpoint has already validated within its
# JSON budgets, and writes results; jsonx-lib has no serde support of its own.
serde = { version = "1.0.200", optional = true, default-features = false, features = ["std"] }
serde_json = { version = "1.0.120", optional = true, default-features = false, features = ["std"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# `#[derive(Serialize, Deserialize)]` in the `serde` feature's tests and docs.
serde     = { version = "1.0.200", features = ["derive"] }


# BENCHMARKS
# #################################
[[bench]]
name              = "bench"
harness           = false
required-features = ["std"]


# EXAMPLES
# #################################
[[example]]
name              = "stdio_echo"
required-features = ["std"]

[[example]]
name              = "pipe_pair"
required-features = ["std"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
# No `panic = "abort"`: the endpoint contains handler panics (DIRECTIVES 4),
# which needs unwinding in this crate's own examples and benches too.
strip         = "symbols"
