# =============================================================================
#  R E P S   ·   rpc-io
# =============================================================================
[package]
name    = "rpc-io"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "JSON-RPC 2.0 core with Content-Length, newline, and HTTP framings: one transport for LSP, DAP, MCP, and service APIs."

# Keywords (5 max)
keywords = ["json-rpc", "rpc", "lsp", "mcp", "protocol"]

# Categories
categories = ["network-programming", "encoding"]

# Links
homepage      = "https://github.com/jamesgober/rpc-io"
repository    = "https://github.com/jamesgober/rpc-io"
documentation = "https://docs.rs/rpc-io"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "rpc_io"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = []


# DEPENDENCIES
# #################################
[dependencies]
# First-party -lang dependencies are wired at v0.2.0, when first used.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
