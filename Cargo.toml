# =============================================================================
#  R E P S   ·   rpc-io
# =============================================================================
[package]
name    = "rpc-io"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "JSON-RPC 2.0 engine with Content-Length and newline framings, a sans-IO core, and a blocking adapter: one transport for LSP, DAP, MCP, and service APIs."

# Keywords (5 max)
keywords = ["json-rpc", "rpc", "lsp", "mcp", "protocol"]

# Categories
categories = ["network-programming", "encoding"]

# Links
homepage      = "https://github.com/jamesgober/rpc-io"
repository    = "https://github.com/jamesgober/rpc-io"
documentation = "https://docs.rs/rpc-io"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "rpc_io"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The endpoint (dispatcher, outgoing calls, cancellation, the blocking adapter)
# needs threads, clocks, and panic containment. Without `std` the crate is the
# message model, the framings, and the correlation map, on `alloc` only.
std = ["jsonx-lib/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The owner's JSON: borrowing parser, pull reader with raw slices, writer.
jsonx-lib = { version = "0.2", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name              = "bench"
harness           = false
required-features = ["std"]


# EXAMPLES
# #################################
[[example]]
name              = "stdio_echo"
required-features = ["std"]

[[example]]
name              = "pipe_pair"
required-features = ["std"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
# No `panic = "abort"`: the endpoint contains handler panics (DIRECTIVES 4),
# which needs unwinding in this crate's own examples and benches too.
strip         = "symbols"
